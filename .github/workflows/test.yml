name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Python package
        run: python -m pip install -e .
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Run JavaScript tests
        run: npm test
      - name: Verify historical benchmark
        run: python src/test_engine.py

  tier2-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Tier 2 dependencies
        run: python -m pip install -e '.[tier2]'
      - name: Install spaCy English model
        run: python -m spacy download en_core_web_sm
      - name: Run real-model Tier 2 tests
        run: python -m unittest tests.test_tier2_spacy_integration -v
